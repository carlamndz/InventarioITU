apiVersion: v1
kind: Service
metadata:
  name: sql-server-external  # Usamos este nombre estandarizado
  namespace: egi-inventario
spec:
  ports:
    - protocol: TCP
      port: 1433
      targetPort: 1433
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: sql-server-external-slice
  namespace: egi-inventario
  labels:
    kubernetes.io/service-name: sql-server-external
addressType: IPv4
ports:
  - protocol: TCP
    port: 1433
endpoints:
  - addresses:
      - "192.168.1.20"

---

apiVersion: v1
kind: Service
metadata:
  name: ldap-service-external
  namespace: egi-inventario
spec:
  ports:
    - protocol: TCP
      port: 389
      targetPort: 389
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ldap-service-external-slice
  namespace: egi-inventario
  labels:
    kubernetes.io/service-name: ldap-service-external
addressType: IPv4
ports:
  - protocol: TCP
    port: 389
endpoints:
  - addresses:
      - "192.168.1.10"